[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth-pipeline"
version = "0.1.0"
description = "Modular photo-to-map building pipeline for VTHacks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "numpy>=2,<3", "shapely>=2.1,<3", "trimesh>=4.6,<6",
  "pyproj>=3.7,<4", "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
